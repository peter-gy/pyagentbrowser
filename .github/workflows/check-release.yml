name: Release Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.classify.outputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect source changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$RUNNER_TEMP/release-check-changed-files"
          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" > "$changed_files"
          if [ ! -s "$changed_files" ]; then
            echo "source=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/pages.yml|README.md|CONTRIBUTING.md|docs/*|development_docs/*|scripts/check_development_docs.py)
                ;;
              *)
                source=true
                break
                ;;
            esac
          done < "$changed_files"
          echo "source=$source" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux distributions
    needs: changes
    if: needs.changes.outputs.source == 'true'
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: ubuntu-latest
      python: "3.11"
      target: x86_64
      manylinux: "2_28"
      artifact: check-linux-x86_64-abi3
      sdist: true

  build-macos:
    name: Build macOS distribution
    needs: changes
    if: needs.changes.outputs.source == 'true'
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: macos-14
      python: "3.11"
      target: aarch64
      artifact: check-macos-aarch64-abi3

  build-windows:
    name: Build Windows distribution
    needs: changes
    if: needs.changes.outputs.source == 'true'
    uses: ./.github/workflows/build-wheel.yml
    with:
      os: windows-latest
      python: "3.11"
      target: x64
      artifact: check-windows-x86_64-abi3

  quality:
    name: Quality and owned contracts
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    env:
      BUILD_PYTHON: "3.14"
      RUST_TOOLCHAIN: 1.97.0
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Fetch upstream release tags
        run: git -C third_party/agent-browser fetch --force --tags origin
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - name: Install quality dependencies
        run: uv sync --locked --no-install-project --extra cdp --python 3.14
      - name: Check release metadata, Python, and Rust
        run: make release-version-check lint typecheck rust-check rust-test
      - name: Test packaging contracts
        run: make test-package

  sdk:
    name: SDK on Python ${{ matrix.python }}
    needs: build-linux
    if: needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: uv sync --locked --no-install-project --python ${{ matrix.python }}
      - name: Download Linux wheel
        uses: actions/download-artifact@v8
        with:
          name: check-linux-x86_64-abi3
          path: dist
      - name: Install Linux wheel
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv pip install --python .venv/bin/python "$wheel"
      - name: Test SDK contracts
        run: uv run --no-sync --python ${{ matrix.python }} pytest -q -m sdk_dx

  native:
    name: Native and browser seams on ${{ matrix.os }}
    needs: [build-linux, build-macos, build-windows]
    if: >-
      needs.build-linux.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-windows.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: check-linux-x86_64-abi3
          - os: macos-14
            artifact: check-macos-aarch64-abi3
          - os: windows-latest
            artifact: check-windows-x86_64-abi3
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: uv sync --locked --no-install-project --python 3.14
      - name: Download native wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install native wheel
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv pip install --python .venv "$wheel" "websockets>=15.0"
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnss3-tools libvulkan1 mesa-vulkan-drivers
      - name: Install recording dependencies
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            exit 0
          fi
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg --yes --no-progress ;;
          esac
      - name: Test native boundary
        run: |
          marker=native_smoke
          if [ "$RUNNER_OS" = Windows ]; then
            marker="native_smoke or sdk_dx"
          fi
          uv run --no-sync --python 3.14 pytest -q -m "$marker"
      - name: Test real-browser seams
        run: |
          chrome_path=$(uv run --no-sync --python 3.14 python scripts/check_chrome.py)
          chrome_path=${chrome_path%$'\r'}
          PYAGENTBROWSER_CHROME="$chrome_path" \
          PYAGENTBROWSER_FAIL_ON_SKIP=1 \
          uv run --no-sync --python 3.14 pytest -q -m integration

  gate:
    name: Required gate
    if: always()
    needs: [changes, build-linux, build-macos, build-windows, quality, sdk, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require every release check
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOURCE_CHANGES: ${{ needs.changes.outputs.source }}
        run: |
          jq --exit-status --arg source "$SOURCE_CHANGES" '
            .changes.result == "success" and
            if $source == "true" then
              all(to_entries[]; .key == "changes" or .value.result == "success")
            else
              all(to_entries[]; .key == "changes" or .value.result == "skipped")
            end
          ' <<<"$RESULTS"
